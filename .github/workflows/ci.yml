name: CI

# Roda, em toda alteração enviada ao GitHub, as MESMAS cinco checagens que até
# hoje eram feitas à mão, sessão a sessão: tipos, lint, testes (nos dois
# fusos), contraste de cores e o SQL único de instalação — mais a varredura de
# contraste NAS TELAS, que abre o app de verdade e mede a cor que a pessoa
# enxerga (item TR-01.3 do guia de melhorias).
#
# Por que isto vale a pena: cada sessão nova que trabalha neste projeto começa
# sem memória da conversa anterior. Um erro conhecido — cortar o dia em UTC,
# esquecer de regerar o instalacao-completa.sql, deixar letra ilegível num card
# — só não voltava porque alguém lembrava de rodar os comandos. Isto tira a
# lembrança do caminho.
#
# NÃO builda o instalador do Windows de propósito: isso é lento e já tem lugar
# próprio (release.yml, disparado por tag ou manualmente).
on:
  push:
  pull_request:
  workflow_dispatch: {}

# Se chegar commit novo na mesma branch enquanto uma rodada está em andamento,
# cancela a antiga — o resultado dela já não interessa mais.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checagens:
    name: Tipos, lint, testes, contraste e SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Guarda o cache do npm entre rodadas (a chave sai sozinha do
          # package-lock.json), pra não baixar tudo de novo a cada vez.
          cache: npm

      - run: npm ci

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Roda a suíte DUAS vezes, no fuso do Brasil e em UTC. A máquina do
      # GitHub usa UTC, e é justamente em UTC que o pior bug de data deste
      # projeto não aparece (PROJETO_STATUS.md, seção 6, itens 34 e 42).
      - name: Testes nos dois fusos
        run: npm run test:fusos

      - name: Contraste de cores
        run: npm run contraste

      # O arquivo único de instalação é GERADO a partir das migrations. Se
      # alguém criar uma migration e esquecer de regerar, uma empresa nova
      # seria instalada sem ela — e o erro só apareceria depois, na tela.
      - name: SQL de instalação está em dia
        run: |
          npm run gerar-instalacao
          if ! git diff --exit-code; then
            echo "::error::O supabase/instalacao/instalacao-completa.sql está desatualizado. Rode 'npm run gerar-instalacao' e faça commit do resultado."
            exit 1
          fi

  contraste-telas:
    name: Contraste nas telas (WCAG, no DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O Playwright NÃO é dependência do projeto de propósito: instalá-lo
      # baixaria centenas de MB de navegador na máquina de quem desenvolve o
      # app, que nunca roda esta ferramenta. Aqui ele é instalado só pra esta
      # rodada — `--no-save` não encosta no package.json.
      - name: Playwright (só nesta rodada)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      # Abre o app de verdade, percorre as 54 telas e mede a cor que a pessoa
      # realmente enxerga — compondo cada fundo translúcido com o que está
      # atrás. É o que a varredura por className do outro job não consegue
      # ver, e foi assim que um contraste de 1,39:1 passou meses sem ninguém
      # notar (PROJETO_STATUS.md, seção 6, item 17).
      #
      # Job separado porque é lento (uns 3 minutos) — assim ele não segura o
      # retorno rápido de tipos, lint e testes.
      - name: Contraste nas telas
        run: npm run contraste:telas

  matriz-rls:
    name: Matriz de RLS
    runs-on: ubuntu-latest

    # A RLS é a única defesa real deste sistema (a permissão por módulo é
    # checada só na tela), e ela falha em SILÊNCIO: policy faltando não dá
    # erro, filtra a zero linhas, e do lado do app isso parece "deu certo"
    # (PROJETO_STATUS.md, seção 6, item 15). Este job monta um banco do zero,
    # simula cinco papéis e confere as 640 combinações de
    # tabela × comando × papel contra supabase/testes-rls/expectativas.csv.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem `npm ci` de propósito: o runner desta suíte não usa dependência
      # nenhuma do projeto, só o `psql`. Assim o job fica curto.
      - name: Cliente psql
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          psql --version

      - name: Matriz de RLS
        run: npm run test:rls

  segredos:
    name: Varredura de segredo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nenhum arquivo de certificado digital pode entrar no repositório: ele
      # é a identidade fiscal da empresa, e este repositório é PÚBLICO (foi
      # aberto pra o auto-update funcionar — seção 6, item 21).
      - name: Nenhum certificado digital versionado
        run: |
          encontrados=$(git ls-files '*.pfx' '*.p12' '*.jks' '*.keystore' 'conexao.json')
          if [ -n "$encontrados" ]; then
            echo "::error::Arquivo que não pode ser versionado: $encontrados"
            exit 1
          fi
          echo "Nenhum certificado ou arquivo de conexão versionado."

      # Versão fixada de propósito: varredura de segredo que muda de regra
      # sozinha vira vermelho misterioso num dia qualquer.
      - name: Procura credencial no conteúdo dos arquivos
        env:
          VERSAO_GITLEAKS: 8.28.0
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO_GITLEAKS}/gitleaks_${VERSAO_GITLEAKS}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          # --no-git varre os arquivos como eles estão AGORA, não o histórico.
          # Isso é deliberado: o histórico deste repositório já carrega segredo
          # de antes (a resposta certa pra isso é TROCAR a credencial, não
          # reescrever o histórico — ver seção 6/8 do PROJETO_STATUS.md), e uma
          # checagem que nunca pode ficar verde é uma checagem que todo mundo
          # aprende a ignorar.
          ./gitleaks detect --no-git --source . --redact --verbose
