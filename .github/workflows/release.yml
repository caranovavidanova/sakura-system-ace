name: Release

# Dispara quando uma tag de versão (ex: v0.1.0) é enviada ao GitHub. Builda o
# instalador Windows e publica como GitHub Release — o app instalado nas lojas
# (via electron-updater) detecta a release nova sozinho e se atualiza.
#
# workflow_dispatch é uma saída manual pra quando o gatilho automático da tag
# não disparar (já aconteceu do GitHub Actions atrasar/travar a fila pro push
# de uma tag) — nesse caso, dá pra rodar manualmente escolhendo a tag como
# "Use workflow from" na aba Actions (ou via API), sem precisar recriar a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # A conexão com o Supabase NÃO é mais embutida no instalador de
      # propósito. Ela era gravada aqui via secrets, o que fazia um instalador
      # servir uma empresa só — e, pior, faria o instalador entregue a um
      # cliente novo já vir apontando pro banco de dados de outra empresa.
      # Hoje cada computador escolhe a conexão na primeira abertura, e o valor
      # fica guardado só naquela máquina (ver src/lib/conexao.ts).
      - name: Build e publica o instalador Windows
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
